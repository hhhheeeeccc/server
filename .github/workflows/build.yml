name: بناء APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: نسخ الكود
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء التطبيق (الطبعتان الكاملة والخفيفة)
        run: ./gradlew assembleFullDebug assembleFullRelease assembleLiteDebug assembleLiteRelease --no-daemon --stacktrace

      - name: إعادة تسمية ملفات APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/full/debug/full-debug.apk     out/Muhammil-2.5-full.apk
          cp app/build/outputs/apk/full/release/full-release.apk out/Muhammil-2.5-full-release.apk
          cp app/build/outputs/apk/lite/debug/lite-debug.apk     out/Muhammil-2.5-lite.apk
          cp app/build/outputs/apk/lite/release/lite-release.apk out/Muhammil-2.5-lite-release.apk
          ls -la out

      - name: رفع APK كملف جاهز للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: محمّل-الفيديوهات-APK
          path: out/*.apk
          if-no-files-found: error
