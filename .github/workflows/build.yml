name: بناء APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: نسخ الكود
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء التطبيق (الطبعتان الكاملة والخفيفة)
        run: ./gradlew assembleFullDebug assembleFullRelease assembleLiteDebug assembleLiteRelease --no-daemon --stacktrace

      - name: إعادة تسمية ملفات APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print
          cp "$(find app/build/outputs/apk -path '*full/debug*'  -name '*.apk' | head -1)" out/Muhammil-2.5-full.apk
          cp "$(find app/build/outputs/apk -path '*full/release*' -name '*.apk' | head -1)" out/Muhammil-2.5-full-release.apk
          cp "$(find app/build/outputs/apk -path '*lite/debug*'  -name '*.apk' | head -1)" out/Muhammil-2.5-lite.apk
          cp "$(find app/build/outputs/apk -path '*lite/release*' -name '*.apk' | head -1)" out/Muhammil-2.5-lite-release.apk
          ls -la out

      - name: رفع APK الخفيف
        uses: actions/upload-artifact@v4
        with:
          name: APK-خفيف
          path: out/Muhammil-2.5-lite*.apk
          if-no-files-found: error

      - name: رفع APK الكامل
        uses: actions/upload-artifact@v4
        with:
          name: APK-كامل
          path: out/Muhammil-2.5-full*.apk
          if-no-files-found: error
