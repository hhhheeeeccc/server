name: بناء APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: نسخ الكود
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء التطبيق
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: إعادة تسمية ملفات APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk      out/Muhammil-Videos-2.4.apk
          cp app/build/outputs/apk/release/app-release.apk  out/Muhammil-Videos-2.4-release.apk
          ls -la out

      - name: رفع APK كملف جاهز للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: محمّل-الفيديوهات-APK
          path: out/*.apk
          if-no-files-found: error
