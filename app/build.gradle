plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.muhammil.videos'
    compileSdk 34

    defaultConfig {
        applicationId "com.muhammil.videos"
        minSdk 24
        targetSdk 34
        versionCode 25
        versionName "2.5"
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // طبعتان من نفس الكود:
    // full = محرك yt-dlp كامل (حجم كبير، MP3 حقيقي ودمج FFmpeg)
    // lite = محرك NewPipeExtractor الخفيف (~2 MB، يوتيوب + إنستغرام بدون حساب)
    flavorDimensions "engine"
    productFlavors {
        full {
            dimension "engine"
        }
        lite {
            dimension "engine"
            applicationIdSuffix ".lite"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // نوقّع بنسخة الـ release بمفتاح debug حتى تكون قابلة للتثبيت مباشرة (sideload)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        jniLibs {
            // مطلوب لمكتبة youtubedl-android
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // محرك الطبعة الكاملة: yt-dlp مُجمَّع لأندرويد + FFmpeg لتحويل MP3
    fullImplementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    fullImplementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    // محرك الطبعة الخفيفة: NewPipeExtractor وجيرانه (جافا خالص — بدون أي native)
    liteImplementation fileTree(dir: 'libs', include: ['*.jar'])
}
